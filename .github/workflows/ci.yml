name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Typecheck
        run: .venv/bin/mypy src/tradingbot

      - name: Tests
        run: .venv/bin/pytest -m "not integration" --cov=src/tradingbot --cov-report=term-missing --cov-fail-under=80
