[project]
name = "tradingbot"
version = "0.1.0"
description = "Automated trading bot with backtesting, analytics and Telegram notifications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "xom9k" }]

dependencies = [
    "ccxt>=4.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "optuna>=3.6",
    "plotly>=5.22",
    "kaleido>=0.2.1",
    "streamlit>=1.36",
    "aiogram>=3.7",
    "tenacity>=8.3",
    "loguru>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "freezegun>=1.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
]

[project.scripts]
tradingbot = "tradingbot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingbot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF",
]
ignore = [
    "N803", # argument name should be lowercase (math notation: H, L, C)
    "N806", # variable in function should be lowercase (math notation)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"dashboard/*" = ["E402"]

[tool.mypy]
# 3.12 rather than 3.11: numpy ships stubs that use PEP 695 `type` statements,
# which mypy only parses when told to target 3.12+. The package itself stays
# 3.11-compatible, and ruff enforces that via target-version = "py311".
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "ccxt.*",
    "plotly.*",
    "streamlit.*",
    "optuna.*",
    "kaleido.*",
    "freezegun.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit the network or external services (excluded from CI)",
    "slow: performance checks measured in seconds rather than milliseconds",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/tradingbot"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
